name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Only what the unit tests import; the embedding model and PyTorch aren't needed here
      - run: pip install pytest numpy anthropic python-dotenv
      - run: pytest -v
